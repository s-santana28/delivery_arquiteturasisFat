name: Spring Boot CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Maven
      working-directory: delivery-api/delivery-api
      run: mvn clean install -DskipTests

    - name: Build Docker image
      working-directory: delivery-api/delivery-api
      run: docker build -t minha-api .

    - name: Run Docker container
      run: |
        docker run -d \
          -p 8080:8080 \
          -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          -e JWT_EXPIRATION="${{ secrets.JWT_EXPIRATION }}" \
          minha-api

    - name: Show Docker containers
      run: docker ps -a

    - name: Show application logs
      run: docker logs $(docker ps -q)

    - name: Test application startup
      run: |
        echo "Aguardando a API ficar online (Health Check)..."
        timeout 40 bash -c 'until curl -f -s http://localhost:8080/actuator/info > /dev/null; do echo "Aguardando..."; sleep 2; done'
        echo "API inicializada com sucesso!"


